<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Geopoliso</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Favicon -->
  <link rel="icon" id="favicon" type="image/svg+xml" href="">

  <!-- CSS -->
  <link rel="stylesheet" href="locais.css">
</head>

<body>

  <!-- ===================== HEADER ===================== -->
<header class="header">
  <div class="header-left">

    <a href="../index.html" class="logo">
      <img src="../Imagenseba/Group 44.png" alt="Geopoliso">
    </a>

    <nav class="nav">
      <a href="../index.html">Home</a>
      <a href="#timeline">Timeline</a>
      <a href="#game">Game</a>
      <a href="#noticias">Notícias</a>
    </nav>

  </div>

  <div class="header-actions">
    <a href="#cadastro" class="link-cadastro">Cadastro</a>

    <a href="#entrar" class="btn-entrar">
      Entrar <span class="arrow">→</span>
    </a>

  </div>
</header>

 <!-- =====================================================
       PÁGINA DO EVENTO
  ====================================================== -->
  <main class="event-page">

    <!-- TOPO -->
    <div class="top-bar">

      <a href="../index.html" class="btn-voltar">
        <span class="arrow-back">←</span>
        <span>Voltar ao home</span>
      </a>

      <div class="theme-toggle-container">

        <button
          id="themeToggle"
          class="theme-toggle"
          aria-label="Alterar tema"
          type="button"
        >

          <img
            class="toggle-light"
            src="../Imagenseba/MUNDOescuro.jfif"
            alt="Tema escuro"
          >

          <img
            class="toggle-dark"
            src="../Imagenseba/MUNDOclaro.jfif"
            alt="Tema claro"
          >

        </button>

      </div>

    </div>


    <!-- =====================================================
         TÍTULO E NAVEGAÇÃO
    ====================================================== -->
    <section class="event-header">

      <div class="event-title">

        <h1>
          Batalha de<br>
          Stalingrado
        </h1>

        <span class="event-years">
          1942 - 1943
        </span>

      </div>


      <div class="event-nav">

        <button
          class="nav-arrow"
          id="prevEvent"
          aria-label="Evento anterior"
          type="button"
        >
          ‹
        </button>

        <div
          class="event-nav-label"
          id="eventLabel"
        >
          Batalha de<br>
          Stalingrado
        </div>

        <button
          class="nav-arrow"
          id="nextEvent"
          aria-label="Próximo evento"
          type="button"
        >
          ›
        </button>

      </div>

    </section>
