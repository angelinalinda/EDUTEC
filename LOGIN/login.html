<!-- =========================================================
     TELA DE CARREGAMENTO — GEOPOLISO
     ========================================================= -->
<div class="geopoliso-loader" id="geopolisoLoader">

  <div class="loader-content">


    <!-- Globo -->
    <div class="loader-globe">

      <div class="globe">
        <div class="globe-line horizontal"></div>
        <div class="globe-line vertical"></div>
        <div class="globe-line diagonal"></div>
        <div class="globe-line diagonal reverse"></div>
      </div>

      <!-- Pontos de conexão -->
      <span class="globe-dot dot-1"></span>
      <span class="globe-dot dot-2"></span>
      <span class="globe-dot dot-3"></span>
      <span class="globe-dot dot-4"></span>

    </div>

    <!-- Texto -->
    <div class="loader-text">
      <span id="loaderStatus">CONECTANDO AO MUNDO</span>
      <span class="loader-dots">...</span>
    </div>

    <!-- Barra de progresso -->
    <div class="loader-progress">
      <div class="loader-progress-bar" id="loaderProgressBar"></div>
    </div>

    <!-- Curiosidade -->
    <div class="loader-fact">
      <span class="fact-label">VOCÊ SABIA?</span>

      <p id="geopoliticalFact">
        Carregando uma curiosidade geopolítica...
      </p>
    </div>

    <!-- Aviso de clique -->
    <button class="loader-skip" id="loaderSkip" type="button">
      Clique para entrar →
    </button>

  </div>

</div>



<!-- ===================== NOVO — CONTEÚDO DE LOGIN ===================== -->

 <div class="theme-toggle-container">
  <button id="themeToggle" class="theme-toggle" aria-label="Alterar tema">
    <img 
      class="toggle-light" 
      src="../Imagenseba/MUNDOescuro.jfif" 
      alt="Tema escuro"
    >

    <img 
      class="toggle-dark" 
      src="../Imagenseba/MUNDOclaro.jfif" 
      alt="Tema claro"
    >
  </button>
</div>

<main class="login-main">
  <div class="login-card">
    <h1>Log in</h1>
    <p class="login-subtitle">Não tem conta? <a href="../CADASTRO/cadastro.html">Cadastre-se</a></p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <input type="email" id="loginEmail" class="input-field" placeholder="Insira seu e-mail..." autocomplete="email" required>
      </div>
      <div class="form-group">
        <input type="password" id="loginSenha" class="input-field" placeholder="Insira sua senha..." autocomplete="current-password" required>
      </div>

      <a href="#" class="forgot-link">Esqueceu sua senha?</a>

      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>
</main>
